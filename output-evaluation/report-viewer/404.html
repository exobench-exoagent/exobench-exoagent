<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fffef7;
      --text: #1c1f24;
      --line: #ded6c8;
      --panel: #ffffff;
      --accent: #c85f1e;
      --accent-soft: #f0b35f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.075) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .brand {
      width: min(1040px, calc(100% - 36px));
      margin: 22px auto 0;
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 800;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 18px 18px 40px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { line-height: 1.2; margin: 1.3em 0 0.5em; }
    h1 { font-size: 2rem; margin-top: 0; }
    p { margin: 0.75em 0; }
    code, pre {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.92em;
    }
    code {
      color: #9a4415;
      overflow-wrap: anywhere;
    }
    .artifact-link {
      color: #c85f1e;
      font-weight: 700;
      text-decoration: none;
    }
    .artifact-link:hover {
      text-decoration: underline;
    }
    .artifact-link code {
      color: inherit;
    }
    .artifact-link span {
      display: inline-block;
      margin-left: 0.28em;
      font-weight: 800;
    }
    pre {
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      background: #f0f2f2;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 18px 0;
      background: var(--panel);
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #fff1df; }
    .report {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 26px;
      border-radius: 6px;
      box-shadow: 0 18px 48px rgba(66, 45, 24, 0.09);
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="brand">ExoAgent Reports for Expert-Based Evaluation</div>
  <main><h1>404</h1><p>No report exists for this ID.</p></main>
</body>
</html>
